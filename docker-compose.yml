name: hexagare

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hexagare
      POSTGRES_USER: hexagare
      POSTGRES_PASSWORD: hexagare
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexagare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend/hexagare
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
    volumes:
      - ./backend/hexagare:/app
      - media_data:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend/hexagare
    command: celery -A hexagare worker -l info
    env_file: .env
    volumes:
      - ./backend/hexagare:/app
      - media_data:/app/media
    depends_on:
      - backend
      - redis

  celery-beat:
    build:
      context: ./backend/hexagare
    command: celery -A hexagare beat -l info -s /tmp/celerybeat-schedule
    env_file: .env
    volumes:
      - ./backend/hexagare:/app
    depends_on:
      - backend
      - redis

volumes:
  postgres_data:
  media_data:
